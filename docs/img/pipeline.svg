<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="250" rx="18" fill="#0E0E10"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8E8E96"/></marker></defs><text x="30" y="44" font-size="20" fill="#EDEDEF" font-weight="800" text-anchor="start">Pipeline: pre-generated AI assets → auto-montage → measured ad variants</text><rect x="30" y="70" width="200" height="150" rx="14" fill="#17171A" stroke="#2A2A2F"/><rect x="30" y="70" width="200" height="4" rx="2" fill="#FF8A3D"/><text x="46" y="100" font-size="12" fill="#8E8E96" font-weight="700" text-anchor="start">AI ASSETS</text><text x="46" y="144" font-size="30" fill="#FF8A3D" font-weight="900" text-anchor="start">19 files</text><text x="46" y="178" font-size="12.5" fill="#8E8E96" font-weight="500" text-anchor="start">synthetic placeholders</text><text x="46" y="198" font-size="12.5" fill="#8E8E96" font-weight="500" text-anchor="start">video · voice · packshot · music</text><path d="M236 145 h21" stroke="#8E8E96" stroke-width="2" marker-end="url(#a)"/><rect x="265" y="70" width="200" height="150" rx="14" fill="#17171A" stroke="#2A2A2F"/><rect x="265" y="70" width="200" height="4" rx="2" fill="#8E8E96"/><text x="281" y="100" font-size="12" fill="#8E8E96" font-weight="700" text-anchor="start">INGEST</text><text x="281" y="144" font-size="30" fill="#8E8E96" font-weight="900" text-anchor="start">normalize</text><text x="281" y="178" font-size="12.5" fill="#8E8E96" font-weight="500" text-anchor="start">720×1280 H.264 · −16 LUFS VO</text><text x="281" y="198" font-size="12.5" fill="#8E8E96" font-weight="500" text-anchor="start">word timings · slot limits</text><path d="M471 145 h21" stroke="#8E8E96" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="70" width="200" height="150" rx="14" fill="#17171A" stroke="#2